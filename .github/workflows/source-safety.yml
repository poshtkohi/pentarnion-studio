name: Public source safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit exact source tree and confirmed licence
        run: python3 -B tools/audit-public-source.py --root . --release
      - name: Test source safety boundaries
        run: python3 -B tests/test_public_source_audit.py
      - name: Test export licence companions
        run: python3 -B tests/test_export_notices.py
      - name: Test public packaging boundaries and manual listings
        run: python3 -B packaging/test_public_release.py --source . --work "${{ runner.temp }}/penta-public-release-tests"
